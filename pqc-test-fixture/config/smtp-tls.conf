# Expected artifact type: protocol (SMTP/STARTTLS, Postfix)
smtpd_tls_protocols = SSLv3, TLSv1, TLSv1.1, TLSv1.2
smtpd_tls_mandatory_ciphers = low
smtpd_tls_cert_file = /etc/ssl/certs/legacy-internal-service.crt
smtpd_tls_key_file = /etc/ssl/private/legacy-internal-service.key
smtpd_tls_dh1024_param_file = /etc/postfix/dh1024.pem
