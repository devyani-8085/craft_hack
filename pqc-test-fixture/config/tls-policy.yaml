# Expected artifact type: protocol (TLS policy) — mixed legacy + modern
tls:
  min_version: TLSv1.0
  max_version: TLSv1.3
  cipher_suites:
    - TLS_RSA_WITH_RC4_128_SHA
    - TLS_RSA_WITH_3DES_EDE_CBC_SHA
    - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1305_SHA256
  curves: [secp256r1, secp384r1, x25519, X25519MLKEM768]
  signature_algorithms: [rsa_pkcs1_sha1, rsa_pss_rsae_sha256, ecdsa_secp256r1_sha256, ed25519]
