# Expected artifact type: protocol (rule_id: infra-weak-tls-protocol)
# Matches scanner/config_infra_analyzer.py::_NGINX_PROTO_RE + _WEAK_PROTOCOLS_RE
# Expected Exposure = External (nginx keyword + listen directive -> isDeployConfig signal)
server {
    listen 443 ssl;
    server_name checkout.cryptoscan-fixture.example.com;

    ssl_certificate     /etc/nginx/certs/public-gateway-api.crt;
    ssl_certificate_key /etc/nginx/certs/public-gateway-api.key;

    # Deliberately weak/legacy protocols enabled for test detection.
    ssl_protocols SSLv3 TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers RC4:3DES:HIGH:!aNULL:!MD5;

    location /api/ {
        proxy_pass http://web-api:8080;
    }
}
