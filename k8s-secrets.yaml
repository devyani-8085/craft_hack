# Expected artifact type: key / certificate (Kubernetes secrets + TLS secret + cert-manager)
apiVersion: v1
kind: Secret
metadata: { name: db-credentials }
stringData:
  password: Sup3rSecretDbPass!2024
---
apiVersion: v1
kind: Secret
metadata: { name: tls-legacy }
type: kubernetes.io/tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: api-cert }
spec:
  privateKey: { algorithm: RSA, size: 1024 }
  secretName: tls-legacy
  dnsNames: [api.cryptoscan-fixture.example.com]
